version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades are planned explicitly (ADR 0005), each in its own pull request.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directories: [/services/catalog, /services/orders, /services/payments]
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    ignore:
      # The base image follows the Node.js LTS line pinned in .nvmrc.
      - dependency-name: node
        update-types: ['version-update:semver-major']
